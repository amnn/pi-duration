# Keep pnpm's lockfile enabled independently of npm's package-lock setting.
lockfile: true

allowBuilds:
  "@google/genai": false
  esbuild: true
  protobufjs: false
minimumReleaseAgeExclude:
  - brace-expansion@5.0.9
overrides:
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
